[package]
name = "ghost-agent"
version = "0.1.0"
edition = "2024"
default-run = "ghost-agent"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
ghost-ipc = { version = "0.1.0", path = "../ipc" }
hex = "0.4.3"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider", "http2", "system-proxy"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sysinfo = "0.38.4"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "signal", "sync", "fs", "process", "io-util"] }
tokio-util = "0.7.19"
toml = "1.1.6"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
wasmtime = { version = "47", default-features = false, features = ["cranelift", "runtime", "std", "anyhow"] }
webpki-roots = "1.0.9"
# GPU compute for image-inference (DX12 on Windows, Vulkan elsewhere). Our shader only.
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "dx12", "vulkan", "wgsl"], optional = true }
pollster = { version = "1.0", optional = true }
bytemuck = { version = "1", optional = true }
zeroize = "1.9.0"

[features]
default = ["gpu"]
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dev-dependencies]
rcgen = "0.14.10"
tempfile = "3.27.0"
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring", "tls12"] }
wat = "1.259.0"
wiremock = "0.6.5"

[target."cfg(windows)".dependencies]
windows-service = "0.8"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_Performance", "Win32_Security_Cryptography", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Power", "Win32_System_SystemInformation", "Win32_System_Memory", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_System_RemoteDesktop"] }

[target."cfg(unix)".dependencies]
libc = "0.2.189"

# Compiling a WebAssembly module with an unoptimized Cranelift takes seconds; tests
# and debug agents run the real sandbox, so the compiler is optimized even in dev.
[profile.dev.package]
cranelift-codegen = { opt-level = 3 }
cranelift-frontend = { opt-level = 3 }
cranelift-assembler-x64 = { opt-level = 3 }
cranelift-bforest = { opt-level = 3 }
cranelift-entity = { opt-level = 3 }
regalloc2 = { opt-level = 3 }
wasmparser = { opt-level = 3 }
wasmtime-environ = { opt-level = 3 }
wasmtime-internal-cranelift = { opt-level = 3 }
