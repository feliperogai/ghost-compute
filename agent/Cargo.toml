[package]
name = "ghost-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider", "http2", "system-proxy"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.38.4"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "signal", "sync", "fs"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
webpki-roots = "1.0.9"
zeroize = "1.9.0"

[dev-dependencies]
rcgen = "0.14.10"
tempfile = "3.27.0"
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring", "tls12"] }
wiremock = "0.6.5"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_Performance", "Win32_Security_Cryptography", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Power", "Win32_System_SystemInformation", "Win32_System_Memory"] }
