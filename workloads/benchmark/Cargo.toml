[package]
name = "ghost-workload-benchmark"
version = "1.0.0"
edition = "2021"
description = "Built-in ghost workload: deterministic CPU benchmark compiled to WebAssembly"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
sha2 = { version = "0.10", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
