name: installer

# Builds the Windows installer and proves it on a clean Windows machine: silent install,
# every change checked, uninstall, nothing left behind (installer/windows/test-install.ps1).
on:
  push:
    paths: ["agent/**", "ipc/**", "desktop/**", "installer/**", "workloads/**", ".github/workflows/installer.yml"]
  pull_request:
    paths: ["agent/**", "ipc/**", "desktop/**", "installer/**", "workloads/**", ".github/workflows/installer.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            agent
            desktop/src-tauri
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: Build agent (release; toolchain pinned by agent/rust-toolchain.toml)
        working-directory: agent
        run: cargo build --release --bins

      - name: Build desktop app (no Tauri bundle; the Worker installer ships it)
        working-directory: desktop
        run: |
          npm ci
          npx tauri build --no-bundle

      - name: Build MSI and setup
        shell: pwsh
        run: |
          $exe = Get-ChildItem desktop/src-tauri/target/release -Filter *.exe | Where-Object Name -in 'ghost.exe', 'ghost-desktop.exe' | Select-Object -First 1
          if (-not $exe) { throw 'desktop exe not found' }
          ./installer/windows/build.ps1 -Version $env:VERSION -BinDir (Resolve-Path agent/target/release) -DesktopExe $exe.FullName

      - name: Install, check, uninstall, check
        shell: pwsh
        run: ./installer/windows/test-install.ps1 -Msi (Resolve-Path "installer/windows/out/ghost-worker-$env:VERSION.msi")

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ghost-worker-installer
          path: |
            installer/windows/out/*.msi
            installer/windows/out/*.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: installer-logs
          path: installer/windows/out/*.log
