name: control-plane

on:
  push:
    paths: ["control-plane/**", "workloads/image-inference/testdata/**", ".github/workflows/control-plane.yml"]
  pull_request:
    paths: ["control-plane/**", "workloads/image-inference/testdata/**", ".github/workflows/control-plane.yml"]

# Least privilege for the workflow token (read the code, nothing else).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ghost
          POSTGRES_PASSWORD: ghost
          POSTGRES_DB: ghost_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U ghost" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: control-plane/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
