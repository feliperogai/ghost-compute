name: control-plane

on:
  push:
    paths: ["control-plane/**", "dashboard/**", "workloads/image-inference/testdata/**", ".github/workflows/control-plane.yml"]
  pull_request:
    paths: ["control-plane/**", "dashboard/**", "workloads/image-inference/testdata/**", ".github/workflows/control-plane.yml"]

# Least privilege for the workflow token (read the code, nothing else).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ghost
          POSTGRES_PASSWORD: ghost
          POSTGRES_DB: ghost_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U ghost" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: control-plane/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  # The server install guide on the real image: compose up, create-admin, API, dashboard.
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: control-plane/scripts/compose-smoke.sh
