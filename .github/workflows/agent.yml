name: agent

on:
  push:
    paths: ["agent/**", "ipc/**", "workloads/**", ".github/workflows/agent.yml"]
  pull_request:
    paths: ["agent/**", "ipc/**", "workloads/**", ".github/workflows/agent.yml"]

# Least privilege for the workflow token (read the code, nothing else).
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        crate: [agent, ipc, workloads/image-inference]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ${{ matrix.crate }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Pinned: the embedded WebAssembly modules are hash-pinned, and their bytes depend
      # on the compiler; wasmtime 47 also needs this toolchain. Upgrade deliberately.
      - uses: dtolnay/rust-toolchain@9376cdc5a5e25b16da71af47712785cf06b0d6d4 # 1.94.1 branch
        with:
          toolchain: 1.94.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ matrix.crate }}
      - name: Software Vulkan (GPU path tests)
        if: matrix.crate == 'agent' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Smoke-run inventory and sampler
        if: matrix.crate == 'agent'
        run: |
          cargo run -q -- hardware
          cargo run -q -- sample --count 2
