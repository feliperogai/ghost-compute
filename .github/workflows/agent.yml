name: agent

on:
  push:
    paths: ["agent/**", "ipc/**", "workloads/**", ".github/workflows/agent.yml"]
  pull_request:
    paths: ["agent/**", "ipc/**", "workloads/**", ".github/workflows/agent.yml"]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        crate: [agent, ipc, workloads/image-inference]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v4
      # Pinned: the embedded WebAssembly modules are hash-pinned, and their bytes depend
      # on the compiler; wasmtime 47 also needs this toolchain. Upgrade deliberately.
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}
      - name: Software Vulkan (GPU path tests)
        if: matrix.crate == 'agent' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Smoke-run inventory and sampler
        if: matrix.crate == 'agent'
        run: |
          cargo run -q -- hardware
          cargo run -q -- sample --count 2
